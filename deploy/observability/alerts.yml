groups:
  - name: sentinela-service
    rules:
      - alert: SentinelaTargetDown
        expr: up{job=~"sentinela-api|sentinela-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sentinela scrape target is unavailable"
          description: "Prometheus cannot scrape {{ $labels.job }} for at least two minutes."

      - alert: SentinelaHighHttp5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="sentinela-api",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{job="sentinela-api"}[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sentinela API 5xx rate is above 5%"
          description: "More than 5% of API responses were 5xx for five minutes."

      - alert: SentinelaOutboxBacklog
        expr: sentinela_outbox_pending > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sentinela outbox backlog is growing"
          description: "More than 100 unpublished events remained for ten minutes."
