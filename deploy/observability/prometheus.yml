global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sentinela-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]
  - job_name: sentinela-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["worker:8081"]
