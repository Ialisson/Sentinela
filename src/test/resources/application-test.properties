spring.datasource.url=jdbc:h2:mem:sentinela;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.rabbitmq.username=test-user
spring.rabbitmq.password=test-password
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
sentinela.outbox.delay-ms=3600000
sentinela.outbox.enabled=false
sentinela.redis.enabled=false
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
sentinela.security.username=test-client
sentinela.security.password=test-secret
sentinela.security.clients-json={"test-client":"test-secret","other-client":"other-secret"}
